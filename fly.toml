# Generated by `fly launch` — this is a starting template, fly will rewrite
# it with your actual app name and region on first launch.
app = "docflow-backend"
primary_region = "fra"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
